# Builds and tests the simulation library, contracts and server on pull requests and on main, where it also publishes
# the server image. Changes that only touch the Unity client or documentation build nothing here.
name: .NET

on:
  pull_request:
    paths-ignore:
      - client/**
      - docs/**
      - "**.md"
  push:
    branches: [main]
    paths-ignore:
      - client/**
      - docs/**
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, analyse and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Restore also audits every direct and transitive package for known vulnerabilities (NuGetAudit).
      - run: dotnet restore Eirora.slnx

      - run: dotnet format Eirora.slnx --no-restore --verify-no-changes

      - run: dotnet build Eirora.slnx --no-restore --configuration Release

      - run: dotnet test --solution Eirora.slnx --no-build --configuration Release

      # measure.sh budget gates the release build's package size (TASK-024); its regression needs no device.
      - name: Test the budget check
        run: tools/device-measurements/test-budget.sh

      # The cold start after a year away is measured by hand (TASK-049); the script is tested against a fake adb.
      - name: Test the cold-start measurement
        run: tools/device-measurements/test-cold-start.sh

  # The time a year away takes to fast-forward (TASK-049) is reported against its budget but never fails the build:
  # timings on shared runners vary too much to gate on, so the tests count the quarter hours it works instead (#170).
  fast-forward:
    name: Time the fast-forward (reported, not gated)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Time a year away
        run: >-
          dotnet run --configuration Release --project benchmarks/Eirora.Simulation.Benchmarks --
          --filter '*FastForwardBenchmarks*' --job short --exporters json --artifacts artifacts/benchmarks

      # The budget is the one FastForwardBenchmarks and performance-budgets.md give for a developer machine.
      - name: Report against the budget
        run: |
          results=artifacts/benchmarks/results/Eirora.Simulation.Benchmarks.FastForwardBenchmarks
          milliseconds=$(jq '.Benchmarks[0].Statistics.Mean / 1e6 | round' "$results-report-full-compressed.json")
          {
            echo "A year away took $milliseconds ms to fast-forward in the year scene's world; the budget is 150 ms."
            cat "$results-report-github.md"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$milliseconds" -gt 150 ]; then
            echo "::warning title=Fast-forward over budget::A year away took $milliseconds ms, more than 150 ms (performance-budgets.md)."
          fi

  image:
    name: Server container image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Every run proves the image builds and deploys as deploy/README.md says; only main publishes that same image, tagged
      # with the commit.
      - name: Build the image
        run: dotnet publish src/Eirora.Server --configuration Release /t:PublishContainer -p:ContainerImageTags=ci

      # Both ways the server is deployed: with Google only, as until the product owner has an Apple Developer account, and
      # with Google and Sign in with Apple.
      - name: Smoke-test the deployment with Google only
        run: deploy/smoke-test.sh tiico/eirora-server:ci google

      - name: Smoke-test the deployment with Google and Apple
        run: deploy/smoke-test.sh tiico/eirora-server:ci google-and-apple

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Publish the image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag tiico/eirora-server:ci ghcr.io/tiico/eirora-server:${{ github.sha }}
          docker push ghcr.io/tiico/eirora-server:${{ github.sha }}
