name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: Simulation, contracts and server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Restore (fails on vulnerable packages via NuGetAudit)
        run: dotnet restore Eirora.slnx
      - name: Check formatting and code style
        run: dotnet format Eirora.slnx --verify-no-changes --no-restore
      - name: Build
        run: dotnet build Eirora.slnx -c Release --no-restore
      - name: Test
        run: dotnet test --solution Eirora.slnx -c Release --no-build
      - name: Check Unity .meta files in shared packages
        run: tools/check-unity-meta.sh

  unity-license:
    name: Unity license available
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unity jobs skipped::Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository secrets to run Unity tests and builds (docs/development.md)."
          fi

  unity-tests:
    name: Unity EditMode tests
    needs: unity-license
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: library-tests-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**') }}
          restore-keys: library-tests-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: editmode

  android:
    name: Android build
    needs: [unity-license, dotnet]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**') }}
          restore-keys: library-android-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          buildName: Eirora
          buildMethod: Eirora.Editor.Builds.Android
          androidExportType: androidPackage
      - uses: actions/upload-artifact@v4
        with:
          name: eirora-android
          path: build/Android
          retention-days: 14

  ios-project:
    name: iOS Xcode project
    needs: [unity-license, dotnet]
    if: needs.unity-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/cache@v4
        with:
          path: client/Library
          key: library-ios-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**') }}
          restore-keys: library-ios-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: iOS
          buildName: Eirora
          buildMethod: Eirora.Editor.Builds.Ios
      - uses: actions/upload-artifact@v4
        with:
          name: eirora-ios-xcode
          path: build/iOS
          retention-days: 7

  ios:
    name: iOS build (unsigned, macOS)
    needs: ios-project
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: eirora-ios-xcode
          path: build/iOS
      - name: Build with Xcode without signing
        run: |
          project=$(find build/iOS -name Unity-iPhone.xcodeproj -maxdepth 3 | head -n 1)
          xcodebuild -project "$project" -scheme Unity-iPhone -configuration Release -sdk iphoneos \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
