# Tests the Unity client, builds it for Android and iOS, and releases main to Google Play's internal test track.
# Runs on pushes that can change a build (the client or the libraries it compiles) and on demand.
# Needs the Unity license secrets in docs/development.md#ci and, to release from main, those in docs/development.md#google-play.
name: Unity

on:
  push:
    paths:
      - client/**
      - src/Eirora.Simulation/**
      - src/Eirora.Contracts/**
      - src/Eirora.WorldGeneration/**
      - .github/workflows/unity.yml
      - .github/actions/free-disk-space/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release to Google Play that has started is allowed to finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  # Only main saves Unity's Library and Gradle's caches; other branches start from main's. A Library is about 2 GB per
  # job, so branches that saved their own pushed main's out of the repository's 10 GB of cache.
  SAVE_CACHES: ${{ github.ref == 'refs/heads/main' }}

# The tests and the builds run side by side after the license check; only the release waits for the tests.
jobs:
  license:
    name: Check Unity license secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail with instructions when a secret is missing
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity license secrets missing::Missing:$missing. Add them under Settings > Secrets and variables > Actions, see docs/development.md#ci."
            exit 1
          fi

  test:
    name: Unity tests
    needs: license
    runs-on: ubuntu-latest
    # The test runner reports its results as a check run on the commit.
    permissions:
      contents: read
      checks: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/free-disk-space
        with:
          required-gb: 23

      - name: Watch disk use
        run: nohup bash -c 'while true; do echo "$(date +%T) $(df --output=used -BM / | tail -n 1)"; sleep 2; done' > "$RUNNER_TEMP/disk.log" 2>&1 &

      - uses: actions/cache/restore@v6
        id: library
        with:
          path: client/Library
          key: unity-library-test-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: client
          testMode: all
          artifactsPath: test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

      - name: Report peak disk use
        if: always()
        run: |
          echo "Peak used: $(sort -n -k2 "$RUNNER_TEMP/disk.log" | tail -n 1)"
          awk 'NR % 5 == 1' "$RUNNER_TEMP/disk.log" | paste -sd ' '
          df -h /

      - uses: actions/cache/save@v6
        if: env.SAVE_CACHES == 'true' && steps.library.outputs.cache-hit != 'true'
        with:
          path: client/Library
          key: ${{ steps.library.outputs.cache-primary-key }}

  # Main ships an app bundle to Google Play's internal test track (D-75), so the product owner's phone updates without a
  # cable and keeps its world; other branches build an APK to sideload. The release job uploads it once the tests pass.
  android:
    name: Android build
    needs: license
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE: ${{ github.ref == 'refs/heads/main' }}
    outputs:
      version: ${{ steps.version.outputs.name }}
    steps:
      # A build signed with another key cannot be installed over the one before without uninstalling, which deletes
      # the world (TASK-014). Without its own key, CI would sign every build with a new debug key.
      - name: Fail with instructions when the signing key is missing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASS"
          [ -n "$ANDROID_KEYALIAS_NAME" ] || missing="$missing ANDROID_KEYALIAS_NAME"
          [ -n "$ANDROID_KEYALIAS_PASS" ] || missing="$missing ANDROID_KEYALIAS_PASS"
          if [ -n "$missing" ]; then
            echo "::error title=Android signing secrets missing::Missing:$missing. Run scripts/create-android-keystore.sh, see docs/development.md#signering."
            exit 1
          fi

      # Checked here rather than in the release job, so that a missing secret fails before the build, not after it.
      - name: Fail with instructions when the Google Play secret is missing
        if: env.RELEASE == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Google Play secret missing::Missing: PLAY_SERVICE_ACCOUNT_JSON. See docs/development.md#google-play."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # The version is the number of commits, the same rule as local builds (BuildVersion).
          fetch-depth: 0

      - uses: ./.github/actions/free-disk-space
        with:
          required-gb: 60

      - name: Watch disk use
        run: nohup bash -c 'while true; do echo "$(date +%T) $(df --output=used -BM / | tail -n 1)"; sleep 2; done' > "$RUNNER_TEMP/disk.log" 2>&1 &

      - name: Version from the number of commits
        id: version
        run: |
          commits="$(git rev-list --count HEAD)"
          echo "name=0.0.$commits" >> "$GITHUB_OUTPUT"
          echo "code=$commits" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: library
        with:
          path: client/Library
          key: unity-library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-android-

      # GameCI mounts the runner's home as the container's, so Gradle's dependencies and build cache land in ~/.gradle.
      # They depend on the Gradle and Android plugin versions that come with Unity, and on the Gradle templates.
      - uses: actions/cache/restore@v6
        id: gradle
        with:
          path: ~/.gradle/caches
          key: gradle-android-${{ hashFiles('client/ProjectSettings/ProjectVersion.txt', 'client/Assets/Plugins/Android/**') }}

      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: Android
          buildName: Eirora
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: ${{ env.RELEASE == 'true' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: eirora.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v7
        with:
          name: eirora-android-${{ steps.version.outputs.name }}
          path: build/Android
          retention-days: 14

      - name: Report peak disk use
        if: always()
        run: |
          echo "Peak used: $(sort -n -k2 "$RUNNER_TEMP/disk.log" | tail -n 1)"
          awk 'NR % 5 == 1' "$RUNNER_TEMP/disk.log" | paste -sd ' '
          df -h /
          sudo du -sh ~/.gradle ~/.gradle/* ~/.gradle/caches/* || true

      - uses: actions/cache/save@v6
        if: env.SAVE_CACHES == 'true' && steps.library.outputs.cache-hit != 'true'
        with:
          path: client/Library
          key: ${{ steps.library.outputs.cache-primary-key }}

      # Gradle writes as root inside the container.
      - name: Make Gradle's caches readable for the cache
        if: (env.SAVE_CACHES == 'true' || github.ref == 'refs/heads/claude/unity-ci-speed') && steps.gradle.outputs.cache-hit != 'true'
        run: sudo chown -R "$(id -u):$(id -g)" ~/.gradle

      - uses: actions/cache/save@v6
        if: (env.SAVE_CACHES == 'true' || github.ref == 'refs/heads/claude/unity-ci-speed') && steps.gradle.outputs.cache-hit != 'true'
        with:
          path: ~/.gradle/caches
          key: ${{ steps.gradle.outputs.cache-primary-key }}

  # Google Play takes completed releases through its API only after the app's first release has been rolled out by hand in
  # Play Console (docs/development.md#google-play).
  release:
    name: Release to Google Play
    needs: [test, android]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eirora-android-${{ needs.android.outputs.version }}
          path: build/Android

      - name: Upload to Google Play's internal test track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.eirora.app
          releaseFiles: build/Android/*.aab
          releaseName: ${{ needs.android.outputs.version }}
          track: internal
          status: completed

  ios-project:
    name: iOS Xcode project
    needs: license
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/free-disk-space
        with:
          required-gb: 24

      - name: Watch disk use
        run: nohup bash -c 'while true; do echo "$(date +%T) $(df --output=used -BM / | tail -n 1)"; sleep 2; done' > "$RUNNER_TEMP/disk.log" 2>&1 &

      - uses: actions/cache/restore@v6
        id: library
        with:
          path: client/Library
          key: unity-library-ios-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-ios-

      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: iOS
          buildName: Eirora

      # Artifacts drop file modes; tar keeps the executable bit on the Xcode project's build scripts.
      - run: tar -czf eirora-ios-xcode.tar.gz -C build iOS

      - uses: actions/upload-artifact@v7
        with:
          name: eirora-ios-xcode
          path: eirora-ios-xcode.tar.gz
          retention-days: 3

      - name: Report peak disk use
        if: always()
        run: |
          echo "Peak used: $(sort -n -k2 "$RUNNER_TEMP/disk.log" | tail -n 1)"
          awk 'NR % 5 == 1' "$RUNNER_TEMP/disk.log" | paste -sd ' '
          df -h /

      - uses: actions/cache/save@v6
        if: env.SAVE_CACHES == 'true' && steps.library.outputs.cache-hit != 'true'
        with:
          path: client/Library
          key: ${{ steps.library.outputs.cache-primary-key }}

  ios:
    name: iOS build (Xcode on macOS)
    needs: ios-project
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eirora-ios-xcode

      - run: mkdir -p build && tar -xzf eirora-ios-xcode.tar.gz -C build

      # Compiles the generated Xcode project for device without signing: proves the iOS chain works before we own an iPhone (D-26).
      - name: Build with Xcode
        run: |
          project="$(find build/iOS -maxdepth 3 -name 'Unity-iPhone.xcodeproj' | head -n 1)"
          if [ -z "$project" ]; then
            echo "::error::Unity-iPhone.xcodeproj not found in the iOS build artifact"
            exit 1
          fi
          xcodebuild \
            -project "$project" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
