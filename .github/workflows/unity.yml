# Tests the Unity client, builds it for Android and iOS, and releases a published GitHub release to Google Play's
# internal test track.
# Pull requests that can change a build (the client or the libraries it compiles) only run the tests: Unity builds are
# slow and macOS minutes cost ten times as much in a private repository. Releases and manual runs also build.
# Needs the Unity license secrets in docs/development.md#ci and, to release, those in docs/development.md#google-play.
name: Unity

on:
  pull_request:
    paths:
      - client/**
      - src/Eirora.Simulation/**
      - src/Eirora.Contracts/**
      - src/Eirora.WorldGeneration/**
      - .github/workflows/unity.yml
      - .github/actions/free-disk-space/**
      - .github/actions/build-version/**
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release to Google Play that has started is allowed to finish.
  cancel-in-progress: ${{ github.event_name != 'release' }}

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  BUILD: ${{ github.event_name != 'pull_request' }}
  RELEASE: ${{ github.event_name == 'release' }}

jobs:
  # Fails within seconds rather than after the tests when a secret is missing or a release cannot be released.
  preflight:
    name: Check secrets and release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail with instructions when a secret is missing
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error title=Unity license secrets missing::Missing:$missing. Add them under Settings > Secrets and variables > Actions, see docs/development.md#ci."
            exit 1
          fi

      # A build signed with another key cannot be installed over the one before without uninstalling, which deletes
      # the world (TASK-014). Without its own key, CI would sign every build with a new debug key.
      - name: Fail with instructions when the signing key is missing
        if: env.BUILD == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          missing=""
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASS"
          [ -n "$ANDROID_KEYALIAS_NAME" ] || missing="$missing ANDROID_KEYALIAS_NAME"
          [ -n "$ANDROID_KEYALIAS_PASS" ] || missing="$missing ANDROID_KEYALIAS_PASS"
          if [ -n "$missing" ]; then
            echo "::error title=Android signing secrets missing::Missing:$missing. Run scripts/create-android-keystore.sh, see docs/development.md#signering."
            exit 1
          fi

      - name: Fail with instructions when the Google Play secret is missing
        if: env.RELEASE == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error title=Google Play secret missing::Missing: PLAY_SERVICE_ACCOUNT_JSON. See docs/development.md#google-play."
            exit 1
          fi

      - uses: actions/checkout@v7
        if: env.RELEASE == 'true'
        with:
          fetch-depth: 0

      # Checks that the tag names a version.
      - uses: ./.github/actions/build-version
        if: env.RELEASE == 'true'

      # A release from another branch would give Google Play a version code that later releases from main stay below.
      - name: Fail when the release tag is not on main
        if: env.RELEASE == 'true'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Release tag not on main::Tag $TAG must point at a commit on main, see docs/development.md#släppa-en-version."
            exit 1
          fi

  test:
    name: Unity tests
    needs: preflight
    runs-on: ubuntu-latest
    # The test runner reports its results as a check run on the commit.
    permissions:
      contents: read
      checks: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/free-disk-space

      - uses: actions/cache@v6
        with:
          path: client/Library
          key: unity-library-test-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-test-

      - uses: game-ci/unity-test-runner@v4
        id: tests
        with:
          projectPath: client
          testMode: all
          artifactsPath: test-results

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

  # The determinism corpus must give the same state in .NET and in the IL2CPP build on Android (TASK-021, NFR-02). The
  # build and the comparison run on separate runners: Unity's Android image needs the disk that the runner's Android SDK
  # takes, and the emulator needs that SDK. Like the app's builds, they run on releases and manual runs only, since
  # together they take over two hours of the Actions budget.
  determinism-build:
    name: Determinism build (IL2CPP for Android)
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/free-disk-space

      - uses: actions/cache@v6
        with:
          path: client/Library
          key: unity-library-determinism-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-android-

      # The build has no version (Builds.AndroidDeterminism), so it needs neither the history nor GameCI's versioning.
      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: Eirora.Editor.Builds.AndroidDeterminism
          buildName: EiroraDeterminism
          versioning: None

      - uses: actions/upload-artifact@v7
        with:
          name: determinism-apk
          path: build/Android/EiroraDeterminism.apk
          if-no-files-found: error
          retention-days: 3

  determinism:
    name: Determinism (.NET and IL2CPP on Android)
    needs: determinism-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Downloaded after the checkout, so the APK is newer than the code, as check-determinism.sh requires.
      - uses: actions/download-artifact@v8
        with:
          name: determinism-apk
          path: client/Builds/Android

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runs the build's x86_64 code natively: Android's ARM translation cannot run Unity's ARM64 engine. The
      # build renders with OpenGL ES 3, which the emulator's software renderer (SwiftShader) provides.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: scripts/check-determinism.sh client/Builds/Android/EiroraDeterminism.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: determinism-hashes
          path: artifacts/determinism
          retention-days: 14

  # A release ships an app bundle to Google Play's internal test track (D-98), so the product owner's phone updates
  # without a cable and keeps its world; a manual run builds an APK to sideload.
  android:
    name: Android build
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The version code is the number of commits.
          fetch-depth: 0

      - uses: ./.github/actions/build-version
        id: version

      - uses: ./.github/actions/free-disk-space

      - uses: actions/cache@v6
        with:
          path: client/Library
          key: unity-library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-android-

      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: Android
          buildName: Eirora
          versioning: Custom
          version: ${{ steps.version.outputs.name }}
          androidVersionCode: ${{ steps.version.outputs.code }}
          androidExportType: ${{ env.RELEASE == 'true' && 'androidAppBundle' || 'androidPackage' }}
          androidKeystoreName: eirora.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - uses: actions/upload-artifact@v7
        with:
          name: eirora-android-${{ steps.version.outputs.name }}
          path: build/Android
          retention-days: 14

      # Also uploads the app's first release; testers get it once Google has approved the health declaration
      # (docs/development.md#google-play).
      - name: Upload to Google Play's internal test track
        if: env.RELEASE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: se.eirora.app
          releaseFiles: build/Android/*.aab
          releaseName: ${{ steps.version.outputs.name }}
          track: internal
          status: completed

      # Keeps the app bundle after the run's artifact has expired.
      - name: Attach the app bundle to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp build/Android/*.aab "eirora-${{ steps.version.outputs.name }}.aab"
          gh release upload "$TAG" "eirora-${{ steps.version.outputs.name }}.aab"

  ios-project:
    name: iOS Xcode project
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/free-disk-space

      - uses: actions/cache@v6
        with:
          path: client/Library
          key: unity-library-ios-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**', 'src/Eirora.Simulation/**', 'src/Eirora.Contracts/**', 'src/Eirora.WorldGeneration/**') }}
          restore-keys: unity-library-ios-

      - uses: ./.github/actions/build-version
        id: version

      - uses: game-ci/unity-builder@v6
        with:
          projectPath: client
          targetPlatform: iOS
          buildName: Eirora
          versioning: Custom
          version: ${{ steps.version.outputs.name }}

      # Artifacts drop file modes; tar keeps the executable bit on the Xcode project's build scripts.
      - run: tar -czf eirora-ios-xcode.tar.gz -C build iOS

      - uses: actions/upload-artifact@v7
        with:
          name: eirora-ios-xcode
          path: eirora-ios-xcode.tar.gz
          retention-days: 3

  ios:
    name: iOS build (Xcode on macOS)
    needs: ios-project
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: eirora-ios-xcode

      - run: mkdir -p build && tar -xzf eirora-ios-xcode.tar.gz -C build

      # Compiles the generated Xcode project for device without signing: proves the iOS chain works before we own an iPhone (D-26).
      - name: Build with Xcode
        run: |
          project="$(find build/iOS -maxdepth 3 -name 'Unity-iPhone.xcodeproj' | head -n 1)"
          if [ -z "$project" ]; then
            echo "::error::Unity-iPhone.xcodeproj not found in the iOS build artifact"
            exit 1
          fi
          xcodebuild \
            -project "$project" \
            -scheme Unity-iPhone \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
