# Starts the public pages with the same compose file as the server and checks what a visitor gets (deploy/site/README.md).
name: Site

on:
  pull_request:
    paths:
      - deploy/site/**
      - deploy/check-labels.sh
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - deploy/site/**
      - deploy/check-labels.sh
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serve:
    name: Serve the privacy policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/site
    env:
      EIRORA_SITE_HOST: site.example.test
      EIRORA_DEVELOPER_NAME: Test Developer
      EIRORA_PRIVACY_CONTACT: privacy@example.test
      EIRORA_ACCOUNT_DELETION_URL: https://api.example.test/account/delete
    steps:
      - uses: actions/checkout@v7

      # Compose fills in variables in label values only; a variable in a label key reaches Traefik literally.
      - name: Check the Traefik labels
        run: ../check-labels.sh

      # On the server Traefik owns this network; here it only has to exist.
      - run: docker network create traefik

      - run: docker compose up --detach --wait --wait-timeout 60

      - name: The policy names the developer, the contact and the deletion page, and keeps its headers
        run: |
          get() { docker compose exec -T site wget -q -S -O - "http://127.0.0.1:8080$1" 2>&1 || true; }
          failed=0
          expect() {
            if ! grep -q -- "$2" <<<"$1"; then echo "::error::Expected: $2"; failed=1; fi
          }
          page="$(get /privacy/)"
          expect "$page" "HTTP/1.1 200"
          expect "$page" "Content-Security-Policy: default-src 'none'"
          expect "$page" "Ansvarig för appen: Test Developer."
          expect "$page" "Developer: Test Developer."
          expect "$page" 'href="mailto:privacy@example.test"'
          expect "$page" 'href="https://api.example.test/account/delete"'
          if grep -q "{{" <<<"$page"; then echo "::error::A placeholder was not filled in"; failed=1; fi
          expect "$(get /site.css)" "HTTP/1.1 200"
          expect "$(get /)" "Location: .*/privacy/"
          if docker compose logs site | grep -q "ERROR"; then echo "::error::The entrypoint reported an error"; failed=1; fi
          if [ "$failed" = 1 ]; then echo "$page"; exit 1; fi

      # Traefik reads the site's labels from Docker, as on the server, and must route the site's host to it.
      - name: Traefik routes the site's host to the policy
        shell: bash
        run: |
          docker run --detach --name proxy --network traefik \
            --volume /var/run/docker.sock:/var/run/docker.sock:ro \
            traefik:v3.7.16 \
            --api.insecure=true \
            --entrypoints.websecure.address=:8443 \
            --providers.docker.exposedbydefault=false > /dev/null
          proxy=$(docker inspect --format '{{.NetworkSettings.Networks.traefik.IPAddress}}' proxy)
          status=missing
          for _ in $(seq 30); do
            status=$(curl --silent --fail "http://$proxy:8080/api/http/routers/eirora-site@docker" | jq --raw-output .status || echo missing)
            [ "$status" = enabled ] && break
            sleep 1
          done
          if [ "$status" != enabled ]; then
            echo "::error::Traefik's router eirora-site@docker is $status, not enabled"
            curl --silent "http://$proxy:8080/api/http/routers" | jq --compact-output '.[] | {name, status, error}'
            exit 1
          fi
          code=$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' \
            --resolve "$EIRORA_SITE_HOST:8443:$proxy" "https://$EIRORA_SITE_HOST:8443/privacy/")
          if [ "$code" != 200 ]; then echo "::error::/privacy/ answered $code through Traefik, expected 200"; exit 1; fi

      - if: failure()
        run: |
          docker compose logs
          docker logs proxy || true
