# Starts the public pages with the same compose file as the server and checks what a visitor gets (deploy/site/README.md).
name: Site

on:
  push:
    paths:
      - deploy/site/**
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serve:
    name: Serve the privacy policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/site
    env:
      EIRORA_SITE_HOST: site.example.test
      EIRORA_DEVELOPER_NAME: Test Developer
      EIRORA_PRIVACY_CONTACT: privacy@example.test
    steps:
      - uses: actions/checkout@v7

      # On the server Traefik owns this network; here it only has to exist.
      - run: docker network create traefik

      - run: docker compose up --detach --wait --wait-timeout 60

      - name: The policy names the developer and the contact, and keeps its headers
        run: |
          get() { docker compose exec -T site wget -q -S -O - "http://localhost:8080$1" 2>&1 || true; }
          failed=0
          expect() {
            if ! grep -q -- "$2" <<<"$1"; then echo "::error::Expected: $2"; failed=1; fi
          }
          page="$(get /privacy/)"
          expect "$page" "HTTP/1.1 200"
          expect "$page" "Content-Security-Policy: default-src 'none'"
          expect "$page" "Ansvarig för appen: Test Developer."
          expect "$page" "Developer: Test Developer."
          expect "$page" 'href="mailto:privacy@example.test"'
          if grep -q "{{" <<<"$page"; then echo "::error::A placeholder was not filled in"; failed=1; fi
          expect "$(get /site.css)" "HTTP/1.1 200"
          expect "$(get /)" "Location: .*/privacy/"
          if docker compose logs site | grep -q "ERROR"; then echo "::error::The entrypoint reported an error"; failed=1; fi
          if [ "$failed" = 1 ]; then printf '%s
' "$page"; exit 1; fi

      - if: failure()
        run: docker compose logs
