# Frees disk space on a GitHub-hosted Ubuntu runner before a job pulls a unityci/editor image.
# The images are larger than the space a hosted runner has free by default, so the pull fails with "no space left on
# device". Every job that pulls one runs this step first, after checkout (a local action needs the repository).
# GameCI builds and tests inside the image, which brings its own Android SDK/NDK and .NET, so the runner's own copies
# can go unless a later step on the runner itself needs them.
name: Free disk space for Unity
description: Removes preinstalled software that Unity jobs do not use, fastest first, until the job's space is free.

inputs:
  required-gb:
    description: Free space on / that the job needs, in GiB. Removal stops as soon as this much is free.
    required: true
  keep-android-sdk:
    description: Keep the runner's Android SDK, for steps outside the Unity image such as an emulator.
    required: false
    default: "false"
  keep-dotnet:
    description: Keep the runner's .NET SDK, for steps outside the Unity image.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Ordered by GiB freed per second on ubuntu-24.04: the Android SDK frees the most but takes 1-2 minutes, so it goes
    # last and only when the rest is not enough.
    - name: Free disk space
      shell: bash
      env:
        REQUIRED_GB: ${{ inputs.required-gb }}
        KEEP_ANDROID_SDK: ${{ inputs.keep-android-sdk }}
        KEEP_DOTNET: ${{ inputs.keep-dotnet }}
      run: |
        free_gb() { df --output=avail -BG / | tail -n 1 | tr -dc '0-9'; }

        # Runs the command that removes something unless enough space is already free.
        remove() {
          local label="$1"
          shift
          local before start
          before="$(free_gb)"
          if [ "$before" -ge "$REQUIRED_GB" ]; then
            return
          fi
          start="$SECONDS"
          "$@" > /dev/null
          echo "Removed $label: $before -> $(free_gb) GiB free in $((SECONDS - start)) s"
        }

        echo "Free: $(free_gb) GiB, the job needs $REQUIRED_GB GiB"
        remove Haskell sudo rm -rf /opt/ghc /usr/local/.ghcup
        remove CodeQL sudo rm -rf /opt/hostedtoolcache/CodeQL
        if [ "$KEEP_DOTNET" != "true" ]; then
          remove .NET sudo rm -rf /usr/share/dotnet
        fi
        remove "Docker images" sudo docker image prune --all --force
        if [ "$KEEP_ANDROID_SDK" != "true" ]; then
          remove "Android SDK" sudo rm -rf /usr/local/lib/android
        fi

        if [ "$(free_gb)" -lt "$REQUIRED_GB" ]; then
          echo "::warning title=Little disk space for Unity::$(free_gb) GiB free, the job needs $REQUIRED_GB GiB. It may fail with \"no space left on device\"."
        fi
