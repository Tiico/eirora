// Health Connect adapter for the spike (TASK-007).
// Unity includes this folder as a Gradle library module of unityLibrary.
// AGP 9 compiles the Kotlin sources with its built-in Kotlin, which Assets/Plugins/Android/gradleTemplate.properties
// turns back on; without it they are skipped without any error, which SpikeBuild catches.
plugins {
    id 'com.android.library'
}

android {
    namespace 'com.eirora.spike.healthconnect.bridge'
    compileSdk 36

    defaultConfig {
        minSdk 26
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.health.connect:connect-client:1.1.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.work:work-runtime-ktx:2.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
